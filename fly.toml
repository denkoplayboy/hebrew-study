# fly.toml app configuration file generated for hebrew-study on 2026-11-13T19:43:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hebrew-study'
primary_region = 'ams'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'shoresh_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
