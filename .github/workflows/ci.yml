name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Проверка JSON-контента
        run: node -e "for (const d of ['content/packs','content/seed','content/inbox']) for (const f of require('fs').readdirSync(d).filter(f=>f.endsWith('.json'))) JSON.parse(require('fs').readFileSync(d+'/'+f,'utf8'))"
